{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume | {{ course.title }}</title>
    <link rel="stylesheet" href="{% static 'css/upload_resume.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-soft">

<div class="bg-scene">
    <div class="bg-img"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
</div>

<div class="main-wrapper">
    <div class="upload-card-v2">

        <svg class="corner-ornament tl" viewBox="0 0 40 40" fill="none">
            <path d="M2 2 L14 2 L14 5 L5 5 L5 14 L2 14 Z" fill="#c9a96e"/>
            <path d="M2 2 L2 14" stroke="#c9a96e" stroke-width="0.5"/>
            <path d="M2 2 L14 2" stroke="#c9a96e" stroke-width="0.5"/>
        </svg>
        <svg class="corner-ornament br" viewBox="0 0 40 40" fill="none">
            <path d="M2 2 L14 2 L14 5 L5 5 L5 14 L2 14 Z" fill="#c9a96e"/>
            <path d="M2 2 L2 14" stroke="#c9a96e" stroke-width="0.5"/>
            <path d="M2 2 L14 2" stroke="#c9a96e" stroke-width="0.5"/>
        </svg>

        <header class="upload-header">
            <div class="icon-pulse">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
            </div>
            <div class="eyebrow">
                <span class="eyebrow-line"></span>
                Application
                <span class="eyebrow-line r"></span>
            </div>
            <h1>Submit Your <em>Resume</em></h1>
            <p>Applying for: <span class="highlight">{{ course.title }}</span></p>
        </header>

        <form method="POST" enctype="multipart/form-data" class="modern-upload-form">
            {% csrf_token %}

            <div class="dropzone-v2" id="dropzone-container">
                <input type="file" name="resume" id="resume-input" required hidden onchange="showFileName()">
                <label for="resume-input" class="dropzone-label" id="dropzone-ui">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.55;margin-bottom:10px">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span class="main-text">Click to browse your files</span>
                    <span class="sub-text">Supported format: PDF — max 5MB</span>
                </label>
            </div>

            <div id="file-info" class="file-status-box" style="display: none;">
                <div class="file-details">
                    <div class="file-check-icon">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <span id="file-name" class="file-name-text"></span>
                </div>
                <button type="button" class="reset-upload-btn" onclick="resetUpload()" title="Remove file">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <button type="submit" class="submit-app-btn">
                <span>Finalize Application</span>
                <div class="btn-shine-fx"></div>
            </button>
        </form>

        <div class="divider-v2"></div>

        <div class="cancel-footer">
            <a href="{% url 'view_courses' %}" class="cancel-link">← Cancel and Go Back</a>
        </div>

    </div>
</div>

<script>
function showFileName() {
    const input = document.getElementById('resume-input');
    const info = document.getElementById('file-info');
    const nameDisplay = document.getElementById('file-name');
    const dropzone = document.getElementById('dropzone-ui');
    const container = document.getElementById('dropzone-container');
    if (input.files.length > 0) {
        nameDisplay.innerText = input.files[0].name;
        info.style.display = "flex";
        container.classList.add('is-ready');
        dropzone.querySelector('.main-text').innerText = "File Selected";
    }
}
function resetUpload() {
    const input = document.getElementById('resume-input');
    const info = document.getElementById('file-info');
    const dropzone = document.getElementById('dropzone-ui');
    const container = document.getElementById('dropzone-container');
    input.value = "";
    info.style.display = "none";
    container.classList.remove('is-ready');
    dropzone.querySelector('.main-text').innerText = "Click to browse your files";
}
</script>

</body>
</html>
