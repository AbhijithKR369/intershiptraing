{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="dark-theme">
    <div class="split-container">
        <div class="left-panel">
            <div class="branding">
                <h1>Secure Checkout</h1>
                <p>Complete your payment via UPI to access your {{ item_type }}.</p>
            </div>
        </div>
        <div class="right-panel">
            <div class="form-container">
                <h2>Payment Details</h2>
                <p>Amount to Pay: <strong>₹{{ amount }}</strong></p>
                <button id="rzp-button1" class="btn">Pay Now with UPI</button>
            </div>
        </div>
    </div>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
    var options = {
        "key": "{{ razorpay_key_id }}", 
        "amount": "{{ payment.amount }}", 
        "currency": "INR",
        "name": "Portal Training",
        "description": "Payment for {{ item_type }}",
        "order_id": "{{ payment.id }}", 
        "handler": function (response){
            submitPaymentForm();
        },
        "prefill": {
            "name": "{{ request.user.profile.full_name|default:request.user.username }}",
            "email": "{{ request.user.profile.email|default:'' }}",
            "contact": "{{ request.user.profile.phone|default:'' }}"
        },
        "theme": {
            "color": "#3b82f6" // matches the blue in standard css
        }
    };
    
    function submitPaymentForm() {
        var form = document.createElement("form");
        form.method = "POST";
        form.action = "{% url 'payment_success' %}";

        var input1 = document.createElement("input");
        input1.type = "hidden";
        input1.name = "item_type";
        input1.value = "{{ item_type }}";

        var input2 = document.createElement("input");
        input2.type = "hidden";
        input2.name = "item_id";
        input2.value = "{{ item.id }}";
        
        var csrf = document.createElement("input");
        csrf.type = "hidden";
        csrf.name = "csrfmiddlewaretoken";
        csrf.value = "{{ csrf_token }}";

        form.appendChild(input1);
        form.appendChild(input2);
        form.appendChild(csrf);
        document.body.appendChild(form);
        form.submit();
    }

    document.getElementById('rzp-button1').onclick = function(e){
        e.preventDefault();
        if ("{{ razorpay_key_id }}" === "rzp_test_dummy_key_id") {
            // Bypass Razorpay for local testing with dummy key
            alert("Test Mode: Bypassing Razorpay checkout. Simulating successful payment.");
            submitPaymentForm();
        } else {
            var rzp1 = new Razorpay(options);
            rzp1.open();
        }
    }
    </script>
</body>
</html>
